server {
    listen 5555;
    root /usr/share/nginx/html;
    index index.html;

    # HTML: mai cachato — il browser scarica sempre index.html fresco
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    # Vite assets (/assets/) — cache permanente con immutable
    # I nomi cambiano ad ogni build grazie al content-hash di Vite
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Altri file statici non hashati (icone, font, immagini)
    location ~* \.(?:ico|gif|jpe?g|png|webp|woff2?|eot|ttf|svg|mp4)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # SPA routing — tutto il resto serve index.html senza cache
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
